spring.application.name=booking-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abc}
spring.datasource.username=${DB_USERNAME:abc}
spring.datasource.password=${DB_PASSWORD:abc}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Where the Vue app is served from; OAuth callbacks and redirects go through it
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# GitHub OAuth app: https://github.com/settings/developers
# Callback URL must be ${app.frontend-url}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${app.frontend-url}/login/oauth2/code/github
